name: Test NSE Data Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "30 14 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect NSE data
        run: |
          python collect_data.py

      - name: Collect F&O data
        run: |
          python collect_fno.py

      - name: Run F&O Telegram scanner
        env:
          FNO_TELEGRAM_BOT_TOKEN: ${{ secrets.FNO_TELEGRAM_BOT_TOKEN }}
          FNO_TELEGRAM_CHAT_ID: ${{ secrets.FNO_TELEGRAM_CHAT_ID }}
        run: |
          python fno_alerts.py

      - name: Run Weekly Hammer Scanner
        run: |
          python weekly_hammer.py

      - name: Combine historical data
        run: |
          python combine_data.py

      - name: Run cash market Telegram scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python cash_alerts.py

      - name: Show generated files
        run: |
          ls -lh

      - name: Upload historical data
        uses: actions/upload-artifact@v4
        with:
          name: cash-historical
          path: |
            Cash_Historical.csv
            cash_data/

      - name: Save consolidated CSV to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Cash_Historical.csv
          git add cash_data/
          git add alert_history.json
          git add fno_data/
          git add fno_alert_history.json

          git commit -m "Update Cash Historical data and alerts" || echo "No changes to commit"

          git push
