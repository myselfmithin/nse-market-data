name: Test NSE Data Collector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect NSE data
        run: |
          python collect_data.py

      - name: Combine historical data
        run: |
          python combine_data.py

      - name: Show generated files
        run: |
          ls -lh

      - name: Upload historical data
        uses: actions/upload-artifact@v4
        with:
          name: cash-historical
          path: |
            Cash_Historical.csv
            cash_data/

      - name: Save consolidated CSV to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Cash_Historical.csv
          git commit -m "Update Cash Historical data" || echo "No changes to commit"
          git push
